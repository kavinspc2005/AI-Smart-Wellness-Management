 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | AI Smart Wellness</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7f6;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px #00000012;
        }

        .login-icon {
            font-size: 48px;
            color: #198754;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <i class="bi bi-shield-lock login-icon"></i>
        <h3 class="fw-bold mt-2">Admin Login</h3>
        <p class="text-muted">Authorized access only</p>
    </div>

    <form id="adminLoginForm">
        <div class="mb-3">
            <label for="email" class="form-label">Admin Email</label>
            <input type="email" id="email" class="form-control"
                   placeholder="Enter admin email" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control"
                   placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-success w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>
            Admin Login
        </button>

        <p id="errorMessage" class="text-danger mt-3 mb-0"></p>
    </form>

    <div class="text-center mt-3">
        <a href="index.html" class="text-success">Back to Home</a>
    </div>
</div>

<script src="js/admin-login.js"></script>
</body>
</html>
