<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | AI Smart Wellness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7f6;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background: #198754;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px #00000010;
        }
        .stat-card h2 {
            color: #198754;
            font-weight: bold;
        }
        .section-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
            box-shadow: 0 3px 12px #00000010;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold">AI Smart Wellness - Admin</span>
    <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
</nav>

<div class="container py-4">
    <h3 class="mb-4">Admin Dashboard</h3>

    <div class="row g-3">
        <div class="col-md-6">
            <div class="stat-card">
                <p>Total Users</p>
                <h2 id="totalUsers">0</h2>
            </div>
        </div>
        <div class="col-md-6">
            <div class="stat-card">
                <p>Total Health Profiles</p>
                <h2 id="totalProfiles">0</h2>
            </div>
        </div>
    </div>

    <div class="section-card">
        <h5>Registered Users</h5>
        <div class="table-responsive">
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody id="usersTable">
                    <tr><td colspan="3">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="section-card">
        <h5>User Health Profiles</h5>
        <div class="table-responsive">
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Age</th>
                        <th>BMI</th>
                        <th>Health Category</th>
                    </tr>
                </thead>
                <tbody id="profilesTable">
                    <tr><td colspan="4">Loading profiles...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
