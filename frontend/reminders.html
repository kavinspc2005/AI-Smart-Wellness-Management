<!-- REMINDER SECTION -->

<section class="dashboard-section">

    <div class="container">


        <!-- HEADER -->

        <div class="mb-4">

            <span class="badge bg-success-subtle text-success">

                <i class="bi bi-alarm"></i>

                Wellness Reminder

            </span>


            <h2 class="fw-bold mt-2">

                Meal & Water Reminders

            </h2>


            <p class="text-muted">

                Stay consistent with your meals and daily
                water intake.

            </p>

        </div>



        <!-- ADD REMINDER CARD -->

        <div class="dashboard-card mb-4">

            <h5 class="fw-bold mb-3">

                <i class="bi bi-plus-circle text-success me-2"></i>

                Add Reminder

            </h5>


            <form id="reminderForm">

                <div class="row g-3">


                    <!-- Reminder Type -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Reminder Type

                        </label>


                        <select
                            id="reminderType"
                            class="form-select"
                            required>

                            <option value="">
                                Select Reminder
                            </option>

                            <option value="Breakfast">
                                🍳 Breakfast
                            </option>

                            <option value="Lunch">
                                🍛 Lunch
                            </option>

                            <option value="Evening Snack">
                                🍎 Evening Snack
                            </option>

                            <option value="Dinner">
                                🍽️ Dinner
                            </option>

                            <option value="Water">
                                💧 Water
                            </option>

                        </select>

                    </div>



                    <!-- Time -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Time

                        </label>


                        <input
                            type="time"
                            id="reminderTime"
                            class="form-control"
                            required>

                    </div>



                    <!-- Add Button -->

                    <div class="col-md-4 d-flex align-items-end">

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            <i class="bi bi-plus-lg me-2"></i>

                            Add Reminder

                        </button>

                    </div>

                </div>

            </form>

        </div>



        <!-- REMINDER LIST -->

        <div class="dashboard-card">

            <div class="d-flex justify-content-between
                        align-items-center mb-4">

                <div>

                    <h5 class="fw-bold mb-1">

                        Today's Reminders

                    </h5>

                    <p class="text-muted mb-0">

                        Your scheduled wellness activities

                    </p>

                </div>


                <i class="bi bi-calendar-check
                          text-success fs-3"></i>

            </div>


            <div id="reminderList">

                <!-- JavaScript reminders will appear here -->

            </div>


            <!-- Empty Message -->

            <div id="emptyMessage"
                 class="text-center text-muted py-4">

                <i class="bi bi-bell-slash fs-1"></i>

                <p class="mt-2">

                    No reminders added yet.

                </p>

            </div>

        </div>


    </div>

</section>



<script
