<!-- ================= SETTINGS ================= -->

<section class="dashboard-section">

    <div class="container">

        <div class="mb-4">

            <span class="badge bg-success-subtle text-success">

                <i class="bi bi-gear"></i>

                Account Settings

            </span>


            <h2 class="fw-bold mt-2">

                Edit Health Profile

            </h2>


            <p class="text-muted">

                Update your personal health information
                and preferences.

            </p>

        </div>



        <!-- SETTINGS CARD -->

        <div class="dashboard-card">

            <form id="settingsForm">

                <div class="row g-4">


                    <!-- Name -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            id="settingsName"
                            class="form-control"
                            required>

                    </div>



                    <!-- Age -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Age

                        </label>

                        <input
                            type="number"
                            id="settingsAge"
                            class="form-control"
                            min="1"
                            required>

                    </div>



                    <!-- Gender -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Gender

                        </label>

                        <select
                            id="settingsGender"
                            class="form-select"
                            required>

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>



                    <!-- Height -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Height (cm)

                        </label>

                        <input
                            type="number"
                            id="settingsHeight"
                            class="form-control"
                            min="1"
                            required>

                    </div>



                    <!-- Weight -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Weight (kg)

                        </label>

                        <input
                            type="number"
                            id="settingsWeight"
                            class="form-control"
                            min="1"
                            step="0.1"
                            required>

                    </div>



                    <!-- Activity -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Activity Level

                        </label>

                        <select
                            id="settingsActivity"
                            class="form-select"
                            required>

                            <option value="">
                                Select Activity Level
                            </option>

                            <option value="Sedentary">
                                Sedentary
                            </option>

                            <option value="Lightly Active">
                                Lightly Active
                            </option>

                            <option value="Moderately Active">
                                Moderately Active
                            </option>

                            <option value="Very Active">
                                Very Active
                            </option>

                        </select>

                    </div>



                    <!-- Food -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Food Preference

                        </label>

                        <select
                            id="settingsFood"
                            class="form-select"
                            required>

                            <option value="">
                                Select Food Preference
                            </option>

                            <option value="Vegetarian">
                                Vegetarian
                            </option>

                            <option value="Non-Vegetarian">
                                Non-Vegetarian
                            </option>

                            <option value="Vegan">
                                Vegan
                            </option>

                            <option value="Eggetarian">
                                Eggetarian
                            </option>

                        </select>

                    </div>



                    <!-- Goal -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Health Goal

                        </label>

                        <select
                            id="settingsGoal"
                            class="form-select"
                            required>

                            <option value="">
                                Select Health Goal
                            </option>

                            <option value="Weight Loss">
                                Weight Loss
                            </option>

                            <option value="Weight Gain">
                                Weight Gain
                            </option>

                            <option value="Muscle Gain">
                                Muscle Gain
                            </option>

                            <option value="Healthy Lifestyle">
                                Healthy Lifestyle
                            </option>

                        </select>

                    </div>

                </div>



                <!-- BMI PREVIEW -->

                <div class="bmi-preview mt-4">

                    <div>

                        <small class="text-muted">
                            Updated BMI
                        </small>

                        <h3 id="settingsBMI">
                            --
                        </h3>

                    </div>


                    <div>

                        <small class="text-muted">
                            Health Category
                        </small>

                        <h5 id="settingsCategory">
                            --
                        </h5>

                    </div>

                </div>



                <!-- BUTTONS -->

                <div class="d-flex gap-2 justify-content-end mt-4">

                    <a href="dashboard.html"
                       class="btn btn-outline-secondary">

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-check-lg me-2"></i>

                        Save Changes

                    </button>

                </div>

            </form>

        </div>

    </div>
