<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Health Profile - AI Smart Wellness</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>


<body class="auth-page">


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-light bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            <i class="bi bi-heart-pulse"></i>

            AI Smart Wellness

        </a>


        <a href="dashboard.html"
           class="btn btn-outline-success">

            <i class="bi bi-speedometer2 me-1"></i>

            Dashboard

        </a>

    </div>

</nav>



<!-- ================= PROFILE SECTION ================= -->

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-8">


                <!-- Profile Card -->

                <div class="auth-card">


                    <!-- Heading -->

                    <div class="text-center mb-4">

                        <div class="auth-icon">

                            <i class="bi bi-person-heart"></i>

                        </div>


                        <h2 class="fw-bold mt-3">

                            Your Health Profile

                        </h2>


                        <p class="text-muted">

                            Tell us about yourself to get
                            personalized wellness recommendations.

                        </p>

                    </div>



                    <!-- Profile Form -->

                    <form id="profileForm">
                        <button type="submit" class="btn btn-primary">
    Save Profile
</button>


                        <!-- ================= PERSONAL INFORMATION ================= -->

                        <h5 class="section-title">

                            <i class="bi bi-person me-2"></i>

                            Personal Information

                        </h5>


                        <div class="row">


                            <!-- Full Name -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="profileName"
                                    class="form-label">

                                    Full Name

                                </label>


                                <input
                                    type="text"
                                    id="profileName"
                                    class="form-control"
                                    placeholder="Enter your name"
                                    required>

                            </div>



                            <!-- Age -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="age"
                                    class="form-label">

                                    Age

                                </label>


                                <input
                                    type="number"
                                    id="age"
                                    class="form-control"
                                    placeholder="Enter your age"
                                    min="1"
                                    max="120"
                                    required>

                            </div>



                            <!-- Gender -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="gender"
                                    class="form-label">

                                    Gender

                                </label>


                                <select
                                    id="gender"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Gender
                                    </option>

                                    <option value="Male">
                                        Male
                                    </option>

                                    <option value="Female">
                                        Female
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>



                            <!-- Height -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="height"
                                    class="form-label">

                                    Height (cm)

                                </label>


                                <div class="input-group">

                                    <input
                                        type="number"
                                        id="height"
                                        class="form-control"
                                        placeholder="Example: 170"
                                        min="50"
                                        max="250"
                                        required>

                                    <span class="input-group-text">
                                        cm
                                    </span>

                                </div>

                            </div>



                            <!-- Weight -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="weight"
                                    class="form-label">

                                    Weight (kg)

                                </label>


                                <div class="input-group">

                                    <input
                                        type="number"
                                        id="weight"
                                        class="form-control"
                                        placeholder="Example: 65"
                                        min="10"
                                        max="300"
                                        required>

                                    <span class="input-group-text">
                                        kg
                                    </span>

                                </div>

                            </div>



                            <!-- Activity -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="activityLevel"
                                    class="form-label">

                                    Activity Level

                                </label>


                                <select
                                    id="activityLevel"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Activity Level
                                    </option>

                                    <option value="Sedentary">
                                        Sedentary - Little exercise
                                    </option>

                                    <option value="Light">
                                        Lightly Active - 1-3 days/week
                                    </option>

                                    <option value="Moderate">
                                        Moderately Active - 3-5 days/week
                                    </option>

                                    <option value="Active">
                                        Very Active - 6-7 days/week
                                    </option>

                                    <option value="Very Active">
                                        Extra Active - Hard training
                                    </option>

                                </select>

                            </div>

                        </div>



                        <!-- ================= WELLNESS PREFERENCES ================= -->

                        <h5 class="section-title mt-4">

                            <i class="bi bi-heart-pulse me-2"></i>

                            Wellness Preferences

                        </h5>


                        <div class="row">


                            <!-- Food Preference -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="foodPreference"
                                    class="form-label">

                                    Food Preference

                                </label>


                                <select
                                    id="foodPreference"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Food Preference
                                    </option>

                                    <option value="Vegetarian">
                                        Vegetarian
                                    </option>

                                    <option value="Non-Vegetarian">
                                        Non-Vegetarian
                                    </option>

                                    <option value="Vegan">
                                        Vegan
                                    </option>

                                    <option value="Eggetarian">
                                        Eggetarian
                                    </option>

                                </select>

                            </div>



                            <!-- Health Goal -->

                            <div class="col-md-6 mb-3">

                                <label
                                    for="healthGoal"
                                    class="form-label">

                                    Health Goal

                                </label>


                                <select
                                    id="healthGoal"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Select Health Goal
                                    </option>

                                    <option value="Weight Loss">
                                        Weight Loss
                                    </option>

                                    <option value="Weight Gain">
                                        Weight Gain
                                    </option>

                                    <option value="Maintain Weight">
                                        Maintain Weight
                                    </option>

                                    <option value="Build Muscle">
                                        Build Muscle
                                    </option>

                                    <option value="Healthy Lifestyle">
                                        Healthy Lifestyle
                                    </option>

                                </select>

                            </div>

                        </div>



                        <!-- ================= BUTTON ================= -->

                        <div class="d-grid mt-4">

                            <button
                                type="submit"
                                class="btn btn-success btn-lg">

                                <i class="bi bi-calculator me-2"></i>

                                Calculate My BMI

                            </button>

                        </div>

                    </form>



                    <!-- ================= BMI RESULT ================= -->

                    <div
                        id="bmiResult"
                        class="bmi-result mt-4 d-none">

                        <div class="text-center">

                            <i class="bi bi-activity bmi-icon"></i>

                            <h4 class="fw-bold mt-2">
                                Your BMI Result
                            </h4>

                            <h1
                                id="bmiValue"
                                class="text-success fw-bold">
                                --
                            </h1>

                            <p class="mb-1">
                                Health Category
                            </p>

                            <h5
                                id="healthCategory"
                                class="fw-bold">
                                --
                            </h5>

                        </div>

                    </div>


                </div>

            </div>

        </div>

    </div>

</section>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Profile JS -->

<script src="js/profile.js"></script>
<script src="js/theme.js"></script>


</body>

</html>
